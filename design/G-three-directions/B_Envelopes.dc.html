<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شناشيل — الظروف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@300;400;500;600&amp;family=Aref+Ruqaa:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16615D}a:hover{color:#0E4643}
button{font-family:inherit;cursor:pointer}
.n{font-family:'Readex Pro',sans-serif;font-feature-settings:"tnum"}
.lattice{background-color:#3B2416;background-image:linear-gradient(45deg,transparent 44%,#5A3A24 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#5A3A24 44% 56%,transparent 56%);background-size:14px 14px}
.pane{position:relative;height:112px;border-radius:999px 999px 6px 6px;background:#203A38;overflow:hidden;box-shadow:inset 0 0 0 3px #4A2F1E}
.glass{position:absolute;left:0;right:0;bottom:0}
.muntin{position:absolute;inset:0;background-image:linear-gradient(90deg,transparent 47%,rgba(59,36,22,.85) 47% 53%,transparent 53%),linear-gradient(0deg,transparent 46%,rgba(59,36,22,.85) 46% 54%,transparent 54%);background-size:100% 100%,100% 30px}
.plaque{background:#F6EFE3;border-radius:8px;padding:5px 6px;text-align:center;font-size:12.5px;line-height:1.4;color:#1E1712}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E6ECE9;font-family:'IBM Plex Sans Arabic',sans-serif;color:#1E1712;direction:rtl;display:flex;flex-direction:column;overflow:hidden">
<div class="lattice" aria-hidden="true" style="height:14px"></div>

<header style="padding:12px 20px 0">
<h1 style="margin:0;font-size:24px;font-weight:700">الظروف</h1>
<p style="margin:0;font-size:13px;color:#5B5048;line-height:1.6">كل شبّاك هدف. الزجاج يتعبّى كل ما تحطّون بيه.</p>
</header>

<section aria-label="خزنة العائلة" style="margin:12px 16px 0;display:flex;gap:14px;align-items:center;background:#3B2416;border-radius:20px;padding:12px 14px;color:#fff">
<div aria-hidden="true" style="position:relative;width:74px;height:96px;flex:none;border-radius:999px 999px 6px 6px;background:#203A38;overflow:hidden;box-shadow:inset 0 0 0 3px #E9B44C">
<div style="position:absolute;left:0;right:0;bottom:0;height:37%;background:linear-gradient(180deg,#F1C766,#C8922A)"></div>
<div style="position:absolute;inset:0;background-image:linear-gradient(90deg,transparent 47%,rgba(59,36,22,.85) 47% 53%,transparent 53%)"></div>
<span style="position:absolute;left:50%;top:44%;width:10px;height:10px;border-radius:50%;background:#E9B44C;transform:translateX(-50%)"></span>
</div>
<div style="flex:1">
<div style="font-size:16px;font-weight:600">باب الخزنة</div>
<div style="font-size:13px;color:#E8D9C4;line-height:1.7">جمعتوا <b class="n" style="color:#F7D58A">375</b> من <b class="n">1,000</b> ألف<br>ينفتح باتفاق بابا وماما</div>
</div>
</section>

<section aria-label="شبابيك الأهداف" style="margin:14px 16px 0;padding:12px;border-radius:20px 20px 10px 10px;background:#3B2416">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<button style="border:none;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-family:inherit"><div class="pane"><div class="glass" style="height:60%;background:linear-gradient(180deg,#3FB5AE,#1F7F7A)"></div><div class="muntin"></div></div><div class="plaque"><b>العيد</b><br><span class="n">120</span>/200</div></button>
<button style="border:none;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-family:inherit"><div class="pane"><div class="glass" style="height:21%;background:linear-gradient(180deg,#6E8FD6,#3B5698)"></div><div class="muntin"></div></div><div class="plaque"><b>مستقبل حسن</b><br><span class="n">210</span>/1000</div></button>
<button style="border:none;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-family:inherit"><div class="pane"><div class="glass" style="height:36%;background:linear-gradient(180deg,#F1C766,#C8922A)"></div><div class="muntin"></div></div><div class="plaque"><b>المدارس</b><br><span class="n">90</span>/250</div></button>
<button style="border:none;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-family:inherit"><div class="pane"><div class="glass" style="height:40%;background:linear-gradient(180deg,#E88B9A,#B24E62)"></div><div class="muntin"></div></div><div class="plaque"><b>العلاج</b><br><span class="n">60</span>/150</div></button>
<button style="border:none;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-family:inherit"><div class="pane"><div class="glass" style="height:55%;background:linear-gradient(180deg,#A796E0,#6B5AA8)"></div><div class="muntin"></div></div><div class="plaque"><b>الصدقة</b><br>بيه <span class="n">6</span> آلاف</div></button>
<button style="border:2px dashed #8A6A50;border-radius:999px 999px 8px 8px;background:transparent;height:112px;color:#E8D9C4;font-size:13px;font-family:inherit">+ شبّاك<br>جديد</button>
</div>
<p style="margin:8px 0 0;text-align:center;font-size:11.5px;color:#B59E85">الأرقام بالألف · دوسوا على أي شبّاك</p>
</section>

<div style="margin:12px 16px 0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:16px;font-size:13.5px">
<span style="flex:1">الفواتير الثابتة: المولدة، النت، الرصيد</span><b class="n">145</b><span style="font-size:12px;color:#5B5048">ألف</span>
</div>

<div style="flex:1"></div>
<button style="margin:0 16px 16px;height:56px;border-radius:18px;border:none;background:#1F7F7A;color:#fff;font-size:15px;font-weight:600">نزل الراتب؟ عبّوا الشبابيك</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

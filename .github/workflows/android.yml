name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated database code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database.g.dart
      - run: flutter analyze
      - name: Unit, database and sync tests
        run: flutter test --exclude-tags golden
      - name: Render screenshots of every screen
        run: flutter test --tags golden --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/test/ui/goldens/*.png
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: ween-floosi-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and family isolation (row-level security)
        # Use whichever Postgres the runner image ships (15 or newer).
        run: PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) supabase/tests/run.sh
